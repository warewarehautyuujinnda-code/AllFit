name: Build APK

# どのブランチへのpushでもビルドする。/kaizen が作るブランチ（issue-N-xxx）を
# マージ前に試すためのAPKと、mainの最新ビルドを両方これでまかなう。
on:
  push:
    branches: ['**']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: アーティファクト名用にブランチ名を整形
        id: safe_name
        run: echo "name=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: APKをアーティファクトとして保存
        uses: actions/upload-artifact@v4
        with:
          name: fitlog-${{ steps.safe_name.outputs.name }}
          path: app/build/outputs/apk/debug/app-debug.apk

      # mainのビルドだけは「latest」タグのリリースとして常に上書き公開する。
      # スマホからはここのリンクを開けば常に最新版をダウンロードできる。
      - name: mainの場合は最新版リリースを更新
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新ビルド
          body: "コミット ${{ github.sha }} から自動生成"
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
